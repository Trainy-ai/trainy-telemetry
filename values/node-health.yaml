## trainy-remediation — GPU node health checks and repair.
##
## Chart: oci://ghcr.io/trainy-ai/charts/trainy-remediation
##
## The NPD DaemonSet runs GPU, RDMA, PCIe, NVMe, kernel and network checks on
## your GPU nodes and publishes each result as a `trainy.ai/<Check>`
## NodeCondition. kube-state-metrics turns those conditions into
## `kube_node_status_condition` series, which the VMAgent ships to Trainy — that
## is how a bad GPU becomes an alert.
##
## The controller acts on those conditions by default — cordon, hand off to the
## provider for repair, validate, return to service. That is the chart's own
## default (`controller.enabled: true`) and this file does not override it, so a
## hand-install from this values file alone gets a working remediation pipeline.
##
## install.sh layers the node pool and drain policy on top from your config, and
## NODE_HEALTH_MODE=detect there turns the controller off for a phased rollout —
## conditions still published and alertable, nothing acted on.
##
## This file holds the settings that are the same either way. Anything specific
## to your hardware (RDMA device list, expected port count, GPUs per node) comes
## from trainy-telemetry.conf.
##
##   helm upgrade --install trainy-remediation \
##       oci://ghcr.io/trainy-ai/charts/trainy-remediation \
##       --namespace trainy-system --create-namespace \
##       --values values/node-health.yaml

## Active checks are operator-driven probes — GPU burn, NCCL pair tests, fio,
## iperf3 — that claim whole GPUs for minutes at a time and are triggered by
## hand or on a schedule. A telemetry install has no use for them, and leaving
## the machinery enabled means a PriorityClass and controller paths that exist
## for something you are not running. Every individual check is off by default
## anyway; this turns off the subsystem.
activeChecks:
  enabled: false

## No batch-scheduler integration: this install does not assume JobSet or Kueue
## CRDs exist, and skips the admission webhook (and its certificate) they would
## need.
enableBatch: false

npd:
  enabled: true

  ## Checks beyond the chart defaults. Each one publishes its own NodeCondition;
  ## whether that condition can act on a node is a separate decision, made in
  ## the `remediation.conditions` map at the bottom of this file.
  checks:
    ## InfiniBand/RoCE port state — link down, degraded rate, wrong width.
    ibPortState:
      enabled: true
    ## Physical-layer link quality from mlxlink: effective BER, module temp,
    ## symbol errors. Catches a fabric degrading before it fails outright.
    ## OFF here, with rdmaGidLayout and roceMtu below: the AMP standard runs
    ## these three only with the B300 RoCE hardware profile, which scopes them
    ## to the fabric NICs and sets the MTU floor. install.sh passes neither, so
    ## here they would read every NIC and could cordon the whole pool.
    mlxlinkPhy:
      enabled: false
    ## GID table layout. A link flap can leave the expected GID index empty with
    ## the real address one slot further along, which breaks any job pinned to a
    ## fixed GID index — on that one device, on that one node.
    rdmaGidLayout:
      enabled: false
    ## RoCE MTU consistency across devices.
    roceMtu:
      enabled: false
    ## DNS resolution from inside a pod's network namespace, not the node's.
    ## These fail differently, and the pod-side failure is the one that breaks
    ## multi-node rendezvous.
    podNetworkDns:
      enabled: true
      namespace: kube-system
    ## Outbound HTTPS reachability. Catches a NAT or egress path failing for a
    ## subset of nodes, which otherwise shows up as unexplained image-pull and
    ## checkpoint-upload failures.
    egressHttps:
      enabled: true

    ## Off by default, overriding the chart, because most clusters have no NFS
    ## and a check with nothing to watch is noise in the condition list rather
    ## than signal. Turn it on only where a hard NFS mount actually exists:
    ##
    ##   --set npd.checks.nfsHealth.enabled=true
    ##
    ## Worth having where it applies. A wedged hard NFS mount hangs the client
    ## forever in uninterruptible sleep — no error, no timeout — whether the
    ## server stopped acking writes or, as on 2026-09-07, the pNFS flexfiles
    ## data servers went unreachable while metadata kept working and every
    ## file read hung. Once enabled it cordons, as in both AMP standards: the
    ## faults seen so far were node-local (a dead NIC optic, miscabled storage
    ## ports), where a cordon is exactly right. On a cluster where outages are
    ## server-side instead, set remediation.conditions.NfsHealth.taint=false.
    nfsHealth:
      enabled: false

  ## Per-node exporters that ship alongside the checks.
  roceExporter:
    enabled: true
    ## Reliability counters (retransmits, sequence errors) — the numbers that
    ## distinguish "the fabric is slow" from "the fabric is dropping".
    reliabilityCounters: true
    extraCounters:
      - roce_adp_retrans
  mlxlinkExporter:
    enabled: true
    nodeSelector:
      ## The chart defaults to nodes labelled for MFT tooling. Null it so the
      ## exporter runs on every GPU node; Helm merges maps, so this key must be
      ## explicitly nulled rather than omitted.
      trainy.ai/mft: null

  metrics:
    enabled: true
    port: 20257

## Emit ServiceMonitors. The VictoriaMetrics operator converts them into its own
## scrape objects and the VMAgent picks them up, so node-health metrics reach
## Trainy without a hand-written scrape config.
##
## This requires the prometheus-operator CRDs (ServiceMonitor), which your
## monitoring stack supplies. If your cluster has no such CRDs, set this false —
## the chart still creates a plain Service on the metrics ports, and node
## conditions still reach Trainy through kube-state-metrics either way.
serviceMonitor:
  enabled: true
  interval: 30s

## Off unless you run the konduktor Grafana provisioning sidecar.
grafanaAlerts:
  enabled: false

## Cross-checks DCGM's XID counters as a second XID signal. Off: the primary
## signal reads the kernel ring buffer directly and does not depend on DCGM or
## on a Prometheus the controller can query.
dcgmXidSignal:
  enabled: false

## Namespaces the controller will not evict from when draining a node.
skipNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - gpu-operator

remediation:
  ## Provider: the cluster's hardware provider performs the physical repair
  ## (reboot, RMA) and the controller drives the state machine around it —
  ## cordon, wait, validate, return to service. Use InCluster only where Trainy
  ## has the ability to reboot nodes directly.
  mode: Provider

  validation:
    ## After a repair, run a NCCL all-reduce before returning the node to
    ## service. A node that cannot complete a collective is not repaired,
    ## whatever its conditions say.
    nccl:
      enabled: true
    ## GPU burn-in is off: it takes minutes per node and duplicates what the
    ## NCCL run already exercises on a return-to-service path.
    burn:
      enabled: false

  ############################################################################
  ## WHICH CONDITIONS MAY ACT ON A NODE.
  ##
  ## `taint: true` means this condition can cordon the node and start the
  ## remediation pipeline. `taint: false` means it is published, alerted and
  ## graphed, but never touches scheduling.
  ##
  ## This is the single most consequential map in the file, and the split is
  ## deliberate: hard faults that make a node unfit for work can cordon it;
  ## signals that are diagnostic, noisy, or fleet-wide rather than node-local
  ## report only. A condition being enabled above says the check RUNS; taint
  ## here says what it is ALLOWED TO DO.
  ##
  ## In detect mode none of this applies — nothing is cordoned at all.
  ############################################################################
  conditions:
    # >>> RENDERED from charts/trainy-remediation/policy/conditions.yaml
    # >>> (profile: nvidia) by policy/render.py. Edit the policy, not
    # >>> this block: `python3 charts/trainy-remediation/policy/render.py`.
    #
    # -- GPU (nvidia-smi / DCGM sensors) -------------------------------------
    # DCGM's own health watch says the GPU is unwell.
    DcgmHealth:       {taint: true}
    # A GPU fell off the PCIe bus. The node cannot do useful work.
    GpuBus:           {taint: true}
    # A hard Xid in the kernel log. Xids 13/31/43/45/68/109 are application
    # errors and trainy-npd filters them out first; only Xids from the last 24
    # hours count (#774).
    GpuXid:           {taint: true}
    # Uncorrectable ECC, or correctable ECC climbing fast. A reboot clears
    # more fault classes than an in-place GPU reset.
    GpuEcc:           {taint: true}
    # Uncorrectable ECC row remaps; the remap takes effect on reset.
    GpuRowRemap:      {taint: true}
    # NVSwitch fabric fault, unless the SXid is on the benign allowlist.
    GpuFabricMgr:     {taint: true}
    # PCIe link degradation; a cycle sometimes retrains it.
    GpuPcie:          {taint: true}
    # Fewer GPUs than EXPECTED_GPU_COUNT. Also one of the witnesses gpus-
    # missing needs before calling a GPU gone rather than unseen.
    # On the standard a GPU that is not there is a GPU that is not there; the
    # expected count is set per cluster (expectedGpus).
    GpuCount:         {taint: true}
    # An NVLink running below its rated speed. No rule in policy.go, so a true
    # gate reaches Escalate through the Ignore->Escalate fallback.
    # Degraded NVLink halves collective bandwidth; the standard cordons.
    NvlinkSpeed:      {taint: true}
    # Duty-cycle: what fraction of the window each GPU spent asserting a
    # thermal-slowdown reason. Throttling is usually aisle airflow, not a bad
    # node, so cordoning on it would take out whole racks for a cooling
    # problem. GpuRawTemp covers the dangerous absolute case with a drain and
    # an hour's hold; this stays detection-only everywhere.
    GpuThermal:       {taint: false}
    # An external power-brake assertion halves GPU clocks and points at power
    # delivery (PSU/PDU/rail), not at cooling. The repair is an electrical
    # inspection.
    # The standard cordons: the repair needs hands, so hold the node.
    GpuPowerBrake:    {taint: true}
    # Absolute GPU temperature ceiling (GPU_RAW_TEMP_MAX_C, default 83C), read
    # while the GPU is still climbing -- unlike GpuThermal, which by
    # construction cannot fire until the hardware is ALREADY capping clocks at
    # its 89-90C limit. The workload is the heat source, so this is the
    # canonical drain-gated condition: evict, hold the node out of service
    # long enough to actually cool, then return it. The node is not broken and
    # is never rebooted or handed to a provider (drain:true implies
    # ForceDrain, which opts out of the provider handoff).
    # The standard arms it; evicting the workload IS the repair.
    GpuRawTemp:       {taint: true, drain: true, holdFor: 1h}
    #
    # -- NIC / RDMA (mlx5, ibstat, mlxlink) ----------------------------------
    # An IB/RoCE port that is down and staying down (ibstat State != Active or
    # Physical state != LinkUp). Dead NIC, bad cable or fabric config, and a
    # reboot repairs none of those, so it escalates.
    RdmaLink:         {taint: true}
    # A link flap is intermittent and validation never touches the NIC, so a
    # flaky link passes it. Physical or config, not state, so it escalates.
    # After a reboot the sensor ignores the first 10 minutes
    # (RDMA_BOOT_GRACE_MINUTES) while links come up, and the node is usually
    # Ready ~4 minutes after boot, so the common 5-minute hand-back hold would
    # end inside that blind window and watch nothing. 20m leaves ~10 minutes
    # of real observation; a new flap restarts it. Repaired in place there is
    # no blind window and the condition only clears after 3 quiet hours.
    RdmaLinkFlapping: {taint: true, holdAfterReboot: 20m}
    # Fewer in-scope RDMA devices than EXPECTED_RDMA_NIC_COUNT. A NIC has
    # physically gone: unambiguous, not transient, and a job placed here fails
    # its collectives.
    RdmaNicCount:     {taint: true}
    # Effective (post-FEC) BER 10x past the 802.3bs budget: RS-FEC is
    # exhausted and frames are being corrupted on the wire. A cable/optics
    # fault (marginal fiber, dying transmitter, dirty connector); cycling the
    # node changes nothing at the PHY, so it escalates for hands-on repair.
    # Read by mlxlink (npd.checks.mlxlinkPhy), which the chart ships off.
    # SENSOR OFF HERE (npd.checks.mlxlinkPhy: false): dead setting.
    RdmaEffectiveBer: {taint: true}
    # Optical module within 5C of its own EEPROM alarm ceiling. Overheating
    # optics degrade (BER rises) and then drop the link; the cause is the
    # module, its seating, or chassis airflow. Read by mlxlink.
    # The standard gives it the GpuRawTemp treatment -- the traffic through
    # the module is part of the heat, so evict the job, hold an hour to cool,
    # revalidate, return. The trade: a module that is actually dying is held
    # and retried rather than handed to AMP to reseat or replace. A module
    # that keeps tripping after the hold is the signal to take this back off.
    # SENSOR OFF HERE (npd.checks.mlxlinkPhy: false): dead setting.
    RdmaModuleTemp:   {taint: true, drain: true, holdFor: 1h}
    # A link flap rebuilt a RoCE port's GID table with a hole, so the routable
    # v2 GID moved (e.g. index 3 -> 4). The port is not broken -- the node
    # runs collectives at full bandwidth under GID auto-detection -- but
    # anything pinning NCCL_IB_GID_INDEX breaks on it. A reboot does not
    # reliably recompact the table, so a true gate escalates for a human to
    # bounce the netdev or stop pinning the index.
    # The standard cordons; jobs there pin the GID index.
    # SENSOR OFF HERE (npd.checks.rdmaGidLayout: false): dead setting.
    RdmaGidLayout:    {taint: true}
    # A RoCE fabric NIC below the jumbo-MTU floor, or the interfaces disagree
    # with each other. Small packets still pass, so the node looks healthy
    # while collectives run slowly or stall. Configuration, not hardware, so
    # no reboot fixes it and a true gate escalates to a human.
    # The standard cordons; the fabric's MTU is set per cluster.
    # SENSOR OFF HERE (npd.checks.roceMtu: false): dead setting.
    RoceMtu:          {taint: true}
    # The mlx5 driver reported insufficient power on the adapter's PCIe slot.
    # The card keeps linking, degraded, until it doesn't -- a riser/PSU/slot
    # fault with no in-cluster repair, so it escalates.
    Mlx5PciPower:     {taint: true}
    # Transceiver/cable over temperature. Optics degrade and then drop; by the
    # time the flap check sees the link bounce the module is cooking.
    Mlx5PortModule:   {taint: true}
    # Deliberately false everywhere, and it should stay that way. A failed
    # ACCESS_REG is the EXPECTED answer from a restricted physical function on
    # converged SKUs (DGX, GB200) whose IB port belongs to system firmware,
    # not the OS. The node is healthy; the signal exists because every counter
    # poll re-triggers it and floods the ring buffer. It tells the operator
    # which devices to exclude via RDMA_INTERFACES/NCCL_IB_HCA.
    # SENSOR OFF HERE (npd.checks.mlx5AccessReg: false): dead setting.
    Mlx5AccessReg:    {taint: false}
    # Fatal HCA lines in the kernel log. Report-only because it does not
    # discriminate: over 30 days on a B300 cluster it was true for 129 node-
    # hours, and in 105 of them RdmaLink was already cordoning the node.
    # Almost all the rest was one synchronised burst across six nodes in an
    # afternoon -- one fabric event, which a true gate would have answered by
    # quarantining six machines at once.
    HcaFatal:         {taint: false}
    # RDMA error counters increasing. RDMA_COUNTER_DELTA_THRESHOLD defaults to
    # 0, so ANY increase trips this -- a true gate at that threshold would
    # cordon continuously. Set a real threshold before reconsidering.
    RdmaCounters:     {taint: false}
    # Cannot reach peers over RDMA after REACHABILITY_FAIL_STREAK consecutive
    # rounds. Genuinely useful, but fabric-wide: one switch event trips it on
    # every node behind that switch at the same moment.
    # SENSOR OFF HERE (npd.checks.rdmaReachability: false): dead setting.
    RdmaReachability: {taint: false}
    #
    # -- Host ----------------------------------------------------------------
    # A physical NIC that somebody brought UP has no carrier -- a dead optic,
    # an unseated or pulled cable, a dark switch port. No in-cluster fix, so a
    # true gate would escalate. Report-only everywhere for now: the predicate
    # (physical + admin-UP + no carrier) is validated against one fleet's B300
    # hosts and no other SKU, and the cost of being wrong is a mass cordon.
    # Flip per cluster once a fleet's healthy baseline is known to be clean,
    # remembering the other asymmetry: a switch or optic failure that takes
    # many ports at once cordons every node behind it.
    NetLinkCarrier:   {taint: false}
    # A required kernel module is not loaded. The node cannot run the workload
    # it advertises capacity for, and no amount of retrying changes that, so
    # quarantine it rather than letting jobs land and fail.
    KernelModules:    {taint: true}
    # The node cannot complete an HTTPS request to ANY configured target for
    # most of a 10-cycle window (~10 minutes). The name says Https, not Tls,
    # on purpose: the check fires on total unreachability at WHATEVER stage,
    # and the stage that actually took a fleet down was TCP (SYN blackhole).
    # CORDONS ON EVERY STANDARD CLUSTER since 2026-09-15: a node that cannot
    # reach anything over HTTPS cannot pull images or write checkpoints, so
    # keeping work off it is worth the cost. If the 87-node shape recurs, the
    # answer is a per-cluster override, announced by Step 10 -- not a comment
    # describing a setting this file does not make.
    EgressHttps:      {taint: true}
    # A wedged NFS client hangs forever in uninterruptible (D-state) sleep: no
    # error, no timeout, and nothing a reboot pipeline can fix when the root
    # cause sits on the NFS server.
    # The standard cordons, after 2026-09-07: two nodes wedged on node-local
    # storage-path faults (a dead NIC optic, reversed cabling), so the fault
    # was per-node and a cordon was exactly right -- jobs kept landing on
    # nodes where every read hung. Added to both standards 2026-08-28.
    # SENSOR OFF HERE (npd.checks.nfsHealth: false): dead setting.
    NfsHealth:        {taint: true}
    # DNS is a cluster/network fault, not a node fault: a reboot does not fix
    # it and it hits many nodes at once. Report-only everywhere.
    DnsResolution:    {taint: false}
    # DNS resolution failing from inside a pod. Same call as DnsResolution: a
    # cluster fault, it hits many nodes at once, and a reboot does not fix it.
    # It fired on 38 distinct nodes in 30 days on one cluster, which is the
    # shape of an outage, not of bad hardware.
    PodNetworkDns:    {taint: false}
    # A local NVMe/RAID mount unit has failed, or an md array is degraded. The
    # "Ready but pods will not schedule" case. Report-only because a reboot
    # does not remake a broken array; read as state only, since a hung mount
    # would hang the check.
    NvmeRaidMount:    {taint: false}
    # Detection-only everywhere, matching its filesystem siblings: a missing
    # mount is frequently a boot-ordering or server-side event that hits many
    # nodes at once, where cordoning the fleet helps nobody. A site that wants
    # parity with a Slurm HealthCheckProgram, which does drain on it, sets
    # this true in its own file.
    # SENSOR OFF HERE (npd.checks.mountHealth: false): dead setting.
    MountHealth:      {taint: false}
    # A drifted BIOS NUMA-per-socket setting (NPS/SNC) is not something a
    # reboot changes -- a true gate would cordon and cycle the node forever.
    # Detection-first, like PcieAcs; true escalates for a human to fix the
    # BIOS.
    # SENSOR OFF HERE (npd.checks.numaTopology: false): dead setting.
    NumaTopology:     {taint: false}
    # PCIe ACS enabled, which blocks peer-to-peer DMA between GPUs. A BIOS or
    # boot-parameter setting: a reboot does not change it, so a true gate
    # would cycle the node forever. Detection-first.
    PcieAcs:          {taint: false}
    # PCIe AER log lines. Detection-first by design.
    PcieAer:          {taint: false}
    #
    # -- AMD (opt-in: npd.amd.enabled) ---------------------------------------
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-GpuBadPages:  null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-GpuCount:     null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-GpuDriver:    null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-GpuEcc:       null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-GpuPcie:      null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-GpuThermal:   null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-Kfd:          null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-Xgmi:         null
    # OFF in this profile: AMD GPU sensor (amd-smi): nothing to read on an
    # NVIDIA GPU.
    amd-DevicePlugin: null
    # OFF in this profile: AMD AINIC NIC sensor: nothing to read on an NVIDIA
    # node.
    amd-RdmaLinkFlap: null
    # OFF in this profile: AMD AINIC NIC sensor: nothing to read on an NVIDIA
    # node. (It is in the passive bundle and self-skips as healthy there.)
    amd-RdmaCounters: null
